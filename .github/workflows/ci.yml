name: CI

# Runs ONLY the deterministic tier (no real LLM): GitHub runners have no
# claude/codex binary, no API creds, and real-agent runs are slow/costly/
# nondeterministic. The real-agent battery (tests/run_all.sh) is local-only.
on:
  push:
  pull_request:

jobs:
  deterministic:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode (Swift 6 for tools-version 6.0)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: swift --version && python3 --version

      - name: Tier 1 — deterministic tests (VigilCore + no-LLM python)
        run: bash tests/ci.sh
